name: operations-tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  software-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only locked inspection-test dependencies
        run: |
          python scripts/check_operations.py requirements > "$RUNNER_TEMP/operations-requirements.txt"
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/operations-requirements.txt"
      - name: Verify operations, metadata contracts and repository inspection
        run: python scripts/check_operations.py check
